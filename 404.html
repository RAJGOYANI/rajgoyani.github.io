<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Raj Goyani</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f4f0e6; --ink: #1b1a17; --muted: #7a756b; --accent: #b5361d; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121210; --ink: #ece7dc; --muted: #8f897d; --accent: #ff6a4d; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: "JetBrains Mono", monospace; padding: 16px; text-align: center; }
  h1 { font: 700 clamp(64px, 14vw, 120px)/1 Fraunces, serif; margin: 0; }
  p { color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
  .k { color: var(--accent); font-weight: 600; }
  a { display: inline-block; margin-top: 16px; color: var(--paper); background: var(--ink); padding: 11px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
  <main>
    <p class="k">Error 404 // Resource not found</p>
    <h1>404</h1>
    <p>No matching log entry for this path.</p>
    <a href="/">← Back to portfolio</a>
  </main>
</body>
</html>
